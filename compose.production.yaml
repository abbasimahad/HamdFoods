name: hamd-foods-erp-prod

x-application-environment: &application-environment
  APP_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.production}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.production}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env.production}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}

services:
  database:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - hamd_factory_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrator:
    build:
      context: .
      target: migrator
    environment: *application-environment
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  operations:
    build:
      context: .
      target: operations
    profiles: ["operations"]
    environment:
      <<: *application-environment
      BACKUP_DIRECTORY: /backups
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST:-14}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - type: bind
        source: ${PRODUCTION_BACKUP_DIRECTORY:?Set PRODUCTION_BACKUP_DIRECTORY in .env.production}
        target: /backups
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

volumes:
  hamd_factory_postgres_data:
